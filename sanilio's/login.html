<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sanilio's</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-page">

        <!-- Hiasan kuning -->
        <div class="yellow-shape"></div>

        <!-- Logo / Brand -->
        <div class="brand">
            <span>Sanilio's</span>
            <strong>MAKE IT EASY</strong>
        </div>

        <!-- Gambar -->
        <div class="hero-image">
            <img src="image/orang.png" alt="Sanilio">
        </div>

        <!-- LOGIN -->
        <div class="auth-content">

            <h1>
                Login <span>↪</span>
            </h1>

            <p class="subtitle">
                Masukan Nama & Kata Sandi
            </p>

            <!-- Nama -->
            <div class="input-group">

                <label for="loginNama">
                    Nama :
                </label>

                <input
                    type="text"
                    id="loginNama"
                >

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="loginPassword">
                    Kata Sandi :
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Lupa Password -->
            <a href="#" class="forgot-password">
                Lupa Kata Sandi?
            </a>


            <!-- Tombol Login -->
            <button
                type="button"
                class="main-button"
                onclick="login()"
            >
                Login
            </button>


            <!-- Daftar -->
            <p class="switch-text">

                Baru Di Sanilio's?

                <a href="register.html">
                    Daftar
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
