<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sanilio's</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-page">

        <!-- Hiasan kuning -->
        <div class="yellow-shape"></div>

        <!-- Logo / Brand -->
        <div class="brand">
            <span>Sanilio's</span>
            <strong>MAKE IT EASY</strong>
        </div>

        <!-- Gambar -->
        <div class="hero-image">
            <img src="image/orang.png" alt="Sanilio">
        </div>

        <!-- LOGIN -->
        <div class="auth-content">
            
            <h1 style="text-align: center;">
                Login <span><img src="image/login.png" alt="Sanilio" style=" width: 30px;
    height: auto;"></span>
            </h1>

            <p class="subtitle" style="text-align: center;">
                Masukan Nama & Kata Sandi
            </p>

            <!-- Nama -->
            <div class="input-group">

                <label for="loginNama">
                    Nama :
                </label>

                <input
                    type="text"
                    id="loginNama"
                >

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="loginPassword">
                    Kata Sandi :
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                    >

                    <!-- <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button> -->
                    <button
    type="button"
    class="toggle-password"
    onclick="togglePassword('loginPassword', this)"
    aria-label="Tampilkan password"
>
    <!-- Mata tertutup -->
    <svg class="eye-closed" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
        <path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"></path>
        <path d="M3 3l18 18"></path>
    </svg>

    <!-- Mata terbuka -->
    <svg class="eye-open" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
    </svg>
</button>

                </div>

            </div>


            <!-- Lupa Password -->
            <a href="#" class="forgot-password">
                Lupa Kata Sandi?
            </a>


            <!-- Tombol Login -->
            <button
                type="button"
                class="main-button"
                onclick="login()"
            >
                Login
            </button>


            <!-- Daftar -->
            <p class="switch-text">

                Baru Di Sanilio's?

                <a href="register.html">
                    Daftar
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
